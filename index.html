:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#13263c;background:#edf4fa}*{box-sizing:border-box}body{margin:0}.app{max-width:1100px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.top{background:#073b75;color:white;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:800}.top small{font-size:14px;font-weight:500}.progress{height:7px;background:#b8d3ec}.progress>div{height:100%;background:#21b86b;transition:width .2s}.content{flex:1;padding:18px 18px 115px}.sheet{background:white;border-radius:20px;padding:clamp(18px,4vw,38px);box-shadow:0 7px 25px #1d47751b}.cover{text-align:center;padding:50px 10px}.cover h1{font-size:clamp(30px,6vw,55px);color:#073b75;line-height:1.13}.cover h2{font-size:clamp(23px,5vw,37px);color:#08754d}.tag{color:#536a81;font-size:17px;font-weight:700}.stem{font-size:clamp(21px,3.6vw,29px);white-space:normal;overflow-wrap:break-word;line-height:1.5;margin:22px 0}.stem p{margin:0 0 18px}.stem p:last-child{margin-bottom:0}.options{display:grid;gap:13px}.option{width:100%;border:3px solid #c8d8e9;border-radius:16px;background:#f6faff;color:#172b42;text-align:left;padding:17px 19px;font-size:clamp(20px,3.3vw,27px);line-height:1.35;cursor:pointer;display:flex;gap:12px}.option strong{color:#07579b}.option.selected{border-color:#246bb1;background:#e4f1ff}.option.correct{background:#d0f7de;border-color:#12884c;color:#064a28}.option.wrong{background:#ffe0e0;border-color:#cb2933;color:#7b141d}.option:disabled{cursor:default}.feedback{font-size:23px;font-weight:800;margin-top:18px}.feedback.good{color:#087f47}.feedback.bad{color:#b5212a}.btn{background:#0a61a8;color:white;border:0;border-radius:13px;padding:14px 18px;font-size:19px;font-weight:800;cursor:pointer}.btn.green{background:#0b8a51}.btn.gray{background:#64748b}.btn:disabled{opacity:.35;cursor:default}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:2px solid #d6e3ef;padding:12px max(12px,calc((100vw - 1076px)/2));display:flex;justify-content:space-between;gap:9px;z-index:4}.bottom .btn{flex:1;padding:13px 7px;font-size:clamp(15px,3vw,20px)}.tablewrap{overflow-x:auto;margin:20px 0}.tablewrap table{border-collapse:collapse;min-width:570px;width:100%;font-size:clamp(17px,2.5vw,23px)}th,td{border:2px solid #7491ab;padding:12px;text-align:left;vertical-align:top}th{background:#d9eaff;color:#073b75}.sourceimg{max-width:100%;height:auto;border:2px solid #d8e2ec;border-radius:12px;margin:15px auto;display:block}.comment{font-size:clamp(23px,3.7vw,30px);line-height:1.55;white-space:pre-wrap}.answer{font-size:clamp(24px,4vw,34px);font-weight:900;color:#087e46}.score{text-align:center;font-size:clamp(23px,4vw,32px)}.score strong{color:#087e46}.note{font-size:17px;color:#516579}.hide{display:none!important}@media(max-width:500px){.content{padding:10px 10px 110px}.sheet{border-radius:14px}.top{font-size:14px;padding:10px}.tablewrap table{font-size:18px}}
</style></head><body><div class="app"><header class="top"><div>📚 CURSO DE CONTABILIDADE<br>PROFESSOR MOREIRA</div><small id="status">CPC 25</small></header><div class="progress"><div id="bar"></div></div><main id="content" class="content"></main><nav class="bottom"><button class="btn gray" id="back">⬅ Voltar</button><button class="btn gray" id="restart">↻ Reiniciar</button><button class="btn" id="next">Avançar ➡</button></nav></div><script>
const Q=[{"num":1,"header":"FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2026","stem":"Em 01/07/2025, uma construtora iniciou a construção de um prédio formado por estúdios de 20 metros quadrados. O prazo estimado para a construção era de 18 meses.\n\nNos primeiros três meses de obra, os gastos diretos, associados à construção, foram de R$ 500.000,00. Em 30/09/2025, um grupo de moradores entrou na Justiça contra a construtora para solicitar a suspensão da obra, já que consideravam que o tipo de apartamento seria prejudicial ao bairro. Além disso, pediam uma indenização de R$ 200.000,00.\n\nNa data, os advogados da construtora julgaram que perda da causa era possível. Ainda, por determinação da justiça, a obra foi suspensa e não havia sido retomada até 31/12/2025.\n\nPor conta do processo, com base na NBC TG 25 (R2) – PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, no Balanço Patrimonial da construtora, em 31/12/2025,","options":["houve uma provisão para contingências de R$ 200.000,00.","houve uma provisão para contingências de R$ 500.000,00.","houve uma provisão para contingências de R$ 700.000,00.","não houve impacto nos elementos patrimoniais."],"answer":"D","comment":"Perda possível não gera provisão: o pedido de indenização de R$ 200.000 é passivo contingente, divulgado se não remoto (itens 27–28 e 86). Os R$ 500.000 são gastos da obra, não valor da obrigação judicial. A suspensão pode exigir avaliação separada de recuperabilidade, mas não cria automaticamente provisão judicial. A alternativa D refere-se ao impacto do processo nos elementos patrimoniais."},{"num":2,"header":"FGV - Bach (CFC)/CFC/2º Exame de Suficiência/2026","stem":"O Departamento jurídico da Empresa Ltda. apresentou parecer acerca dos seguintes casos que envolvem situações jurídicas e fiscais em andamento:\n\n • CASO 1: Autuação Fiscal: Auto de infração recebido do fisco Federal. A probabilidade de perda é avaliada como PROVÁVEL, sendo possível fazer uma estimativa confiável do valor. • CASO 2: Ação Cível: Processo movido por um cliente por danos morais. A probabilidade de perda é classificada como POSSÍVEL. • CASO 3: Processo Trabalhista: Ação judicial movida por um empregado. Os advogados da empresa classificam a perda como REMOTA.\n\nDe acordo com as informações do departamento jurídico da empresa e as determinações da NBC TG 25 (R2) – PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, assinale a opção correta a respeito da forma como a empresa deve proceder em relação ao reconhecimento contábil e à evidenciação em notas explicativas para os três casos apresentados.","options":["CASO 1: Reconhecer a provisão no Passivo e divulgar em notas explicativas; CASO 2: Não reconhecer no Passivo, apenas divulgar como passivo contingente em nota explicativa; CASO 3: Não reconhecer e nem divulgar em notas explicativas.","CASO 1: Não reconhecer no Passivo, apenas divulgar como passivo contingente em nota explicativa; CASO 2: Reconhecer provisão no Passivo; CASO 3: Não reconhecer no Passivo, apenas divulgar como passivo contingente em nota explicativa.","CASO 1: Não reconhecer e nem divulgar em notas explicativas; CASO 2: Não reconhecer no Passivo, apenas divulgar como passivo contingente em nota explicativa; CASO 3: Reconhecer provisão no Passivo.","CASO 1: Reconhecer a provisão no Passivo; CASO 2: Não reconhecer e nem divulgar em notas explicativas; CASO 3: Não reconhecer e nem divulgar em notas explicativas."],"answer":"A","comment":"Caso 1: obrigação provável e mensurável: reconhecer provisão e divulgar (item 14). Caso 2: perda possível: não reconhecer, mas divulgar passivo contingente (itens 27–28 e 86). Caso 3: perda remota: não reconhecer nem divulgar, salvo circunstâncias excepcionais (item 28)."},{"num":3,"header":"FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2025","stem":"Para que um passivo se qualifique para reconhecimento, é necessário haver não somente uma obrigação presente, mas também a probabilidade de saída de recursos que incorporem benefícios econômicos para liquidar essa obrigação.\n\nNo caso de uma Provisão, o reconhecimento se dá quando:\n\n (a) a entidade tem uma obrigação presente (legal ou não formalizada) como resultado de evento passado; (b) seja provável uma necessária saída de recursos que incorporem benefícios econômicos para liquidar a obrigação; e (c) possa ser feita uma estimativa confiável do valor da obrigação. Se essas condições não forem satisfeitas, nenhuma provisão deve ser reconhecida.\n\nEm relação ao reconhecimento de um PASSIVO CONTINGENTE, de acordo com a NBC TG 25 (R2), é correto afirmar que","options":["não é reconhecido e nem divulgado em notas explicativas.","não é reconhecido, mas é divulgado em notas explicativas.","é reconhecido e divulgado em notas explicativas.","é reconhecido, mas não é divulgado em notas explicativas."],"answer":"B","comment":"GABARITO: LETRA B. O passivo contingente não é reconhecido no balanço patrimonial (NBC TG 25, item 27), mas é divulgado em notas explicativas, salvo quando a possibilidade de saída de recursos for remota (itens 28 e 86).},{"num":4,"header":"FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2025","stem":"De acordo com a NBC TG 25 (R2) - PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, provisão é um passivo de prazo incerto ou de valor incerto.\n\nConsidere que a sociedade empresária Beta tenha recebido laudo de seu advogado sobre um provável pagamento de processo trabalhista, entretanto com mensuração ainda não confiável.\n\nNesse caso, o seu reconhecimento nas demonstrações financeiras deve ser","options":["como apropriação por competência no balanço patrimonial.","como provisão trabalhista no balanço patrimonial.","não realizar reconhecimento de provisão trabalhista no balanço patrimonial e não divulgar em nota explicativa.","não realizar reconhecimento de provisão trabalhista no balanço patrimonial, mas divulgar em nota explicativa como passivo contingente."],"answer":"D","comment":"Embora a perda seja provável, não há mensuração confiável. Faltou um dos três requisitos cumulativos do item 14: obrigação presente, saída provável e estimativa confiável. Não reconhecer provisão; divulgar como passivo contingente, salvo exceção aplicável (itens 26 e 86)."},{"num":5,"header":"FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2025","stem":"De acordo com a NBC TG 25 (R2) - PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, a entidade deve divulgar, em notas explicativas, para cada classe de passivo contingente na data do balanço, uma breve descrição da natureza do passivo contingente, a menos que a possibilidade de ocorrer qualquer desembolso na liquidação seja","options":["remota.","possível.","provável.","possível e provável."],"answer":"A","comment":"O item 86 determina divulgar cada classe de passivo contingente, exceto quando a possibilidade de saída de recursos for remota. Possível é divulgado; provável com obrigação presente e estimativa confiável costuma exigir provisão."},{"num":6,"header":"FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2025","stem":"Em janeiro de 2025, um artista, que possui uma empresa, estava em um evento estratégico em um resort na Bahia. Ao voltar da viagem, descobriu que um influenciador digital, que também estava no evento, divulgou fotos e vídeos do artista em redes sociais.\n\nA empresa do artista entrou na justiça por quebra de privacidade contra o resort e contra o influenciador, pedindo, respectivamente, R$ 10.000,00 e R$ 15.000,00.\n\nOs advogados da empresa do artista julgaram que as chances de ganho das causas eram, respectivamente, remota e possível. Com base no julgamento dos advogados, a empresa deve apresentar, em suas demonstrações contábeis, um ativo contingente","options":["igual a zero.","de R$ 10.000,00.","de R$ 15.000,00.","de R$ 25.000,00."],"answer":"A","comment":"Uma ação proposta pela entidade representa potencial entrada de benefícios, isto é, ativo contingente. O item 31 proíbe reconhecer ativo contingente; o item 34 permite divulgação somente quando a entrada for provável. Aqui as chances são remota e possível: nenhum ativo reconhecido, e nenhum valor de ativo contingente no balanço."},{"num":7,"header":"FGV - Bach (CFC)/CFC/2º Exame de Suficiência/2025","stem":"A empresa S.A. possuía, em 31/12/2024, obrigações presentes como resultados de eventos passados cuja saída de recursos envolvendo benefícios futuros na liquidação esteve sujeita à análise, com a classificação disposta na tabela a seguir:\n\n[TABELA_1]\n\nCom base nos dados, seguindo a NBC TG 25 (R2) - PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, o montante a ser reconhecido como provisões no Balanço Patrimonial da empresa deve ser de","options":["R$ 20.000,00.","R$ 40.000,00.","R$ 30.000,00.","R$ 50.000,00."],"answer":"A","comment":"Garantia de venda R$ 5.000 + terreno contaminado com obrigação não formalizada R$ 15.000 = R$ 20.000. Ambas são obrigações presentes, prováveis e mensuráveis. Os processos remoto e possível não entram; o processo fiscal também não é provável nem mensurável (item 14).","tables":[[["Tipo de Obrigação","Valores de mensuração por estimativa confiável","Probabilidade de ocorrência de saída de recurso"],["Garantia de venda","R$ 5.000,00","Provável"],["Terreno contaminado e obrigação não formalizada","R$ 15.000,00","Provável"],["Processo Trabalhista I","R$ 10.000,00","Remota"],["Processo Trabalhista II","R$ 20.000,00","Possível"],["Processo Fiscal","Há impossibilidade de estimar confiavelmente no momento.","Possível"]]]},{"num":8,"header":"FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2024","stem":"Em janeiro de 2024, Joana adquiriu ingresso para um show musical que aconteceria em 11/02/2024.\n\nO show estava agendado para começar às 18 horas, mas só teve início às 22 horas. Joana precisou sair às 21 horas, de modo que não assistiu ao show.\n\nPor conta do atraso, Joana entrou na justiça contra os organizadores do show, pedindo a devolução do preço do ingresso, que havia custado R$400, e uma indenização por danos morais, de R$1.000.\n\nOs advogados dos organizadores do show julgaram que a necessidade de pagamento decorrente da perda da causa por danos morais era possível, enquanto a perda da causa pela devolução do preço do ingresso, era provável.\n\nAssinale a opção que indica o valor da provisão reconhecida pelos organizadores do show, devido à causa de Joana.","options":["Zero.","R$400.","R$1.000.","R$1.400."],"answer":"B","comment":"Devolução do ingresso: R$ 400, perda provável e valor conhecido → provisão. Danos morais: R$ 1.000, perda possível → passivo contingente divulgado, sem reconhecimento. Provisão total = R$ 400 (itens 14, 27 e 28)."},{"num":9,"header":"FGV - Bach (CFC)/CFC/2º Exame de Suficiência/2024","stem":"A NBC TG 25 – PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES ilustra o tratamento contábil quando uma obrigação presente ou possível da entidade envolve prazos ou valores incertos.\n\nCom base na referida norma, relacione o tratamento dado a cada situação a seguir com seu reconhecimento e divulgação.\n\n I. Há obrigação presente que provavelmente requer uma saída de recursos.\n\n II. Há obrigação possível ou obrigação presente que pode requerer, mas provavelmente não irá requerer, uma saída de recursos.\n\n III. Há obrigação possível ou obrigação presente cuja probabilidade de uma saída de recursos é remota.\n\n ( ) Não é reconhecida nenhuma provisão e não há obrigatoriedade de divulgação.\n\n ( ) Deve-se reconhecer a provisão e divulgar em nota explicativa.\n\n ( ) Não é reconhecida a provisão, mas é divulgado o fato em nota explicativa como passivo contingente.\n\nA relação correta, na ordem apresentada, é","options":["III – I – II.","III – II – I.","II – I – III.","I – III – II."],"answer":"A","comment":"A ordem das descrições é: risco remoto → III (sem reconhecimento nem divulgação); saída provável com obrigação presente e mensuração confiável → I (reconhece e divulga); possível → II (divulga sem reconhecer). Sequência III – I – II."},{"num":10,"header":"FGV - Bach (CFC)/CFC/2º Exame de Suficiência/2024","stem":"Um curso de idiomas oferecia aulas de inglês, espanhol e japonês. Em 2024, a gerência do curso resolveu extinguir a oferta de aulas de japonês e espanhol, passando a oferecer apenas aulas de inglês. A reorganização dos cursos teve efeito material na natureza e no foco das operações do curso, de modo que foi constituída uma provisão para reestruturação. Assinale a opção que indica gastos que podem ser incluídos no valor da provisão.","options":["Novo treinamento da equipe permanente.","Investimento em novos sistemas e redes de distribuição.","Gastos incrementais de marketing relacionado ao curso de inglês.","Indenização aos proprietários das salas onde eram ofertados os cursos e que deixaram de ser utilizadas."],"answer":"D","comment":"A provisão de reestruturação inclui somente desembolsos diretos necessariamente decorrentes da reestruturação e não associados às atividades contínuas (itens 80–83). Indenização para desocupar salas enquadra-se. Treinamento, novos sistemas e marketing da operação futura não integram."},{"num":11,"header":"CONSULPLAN - Bach (CFC)/CFC/2º Exame de Suficiência/2023","stem":"O balanço patrimonial de uma sociedade comercial, em 31 de dezembro de 2021, apresentava saldo de R$ 1.300.000,00 na conta Provisão para processos judiciais. A composição dessa conta contábil era a seguinte:\n\n[TABELA_1]\n\nNo encerramento do exercício social, em 31 de dezembro de 2022, os consultores jurídicos realizaram análise detalhada de todos os processos judiciais que envolviam a sociedade comercial, avaliando a probabilidade de desembolso para liquidação das ações judiciais (expectativa de perda) e apresentou o seguinte sumário à administração:\n\n[TABELA_2]\n\nCom base, exclusivamente, nas informações apresentadas, considerando o disposto na NBC TG 25 (R2) – Provisões, Passivos Contingentes e Ativos Contingentes, o efeito líquido no resultado da sociedade comercial no exercício findo em 31 de dezembro de 2022, decorrente da contabilização das provisões para processos judiciais, desconsiderando eventuais efeitos fiscais, foi:","options":["Redução de R$ 150.000,00.","Redução de R$ 170.000,00.","Aumento de R$ 110.000,00.","Aumento de R$ 150.000,00."],"answer":"D","comment":"Provisão necessária em 2022 = R$ 700.000 (trabalhistas prováveis) + R$ 450.000 (tributários prováveis) = R$ 1.150.000. Saldo anterior R$ 1.300.000. Reversão líquida = R$ 150.000, aumentando o resultado. Os valores possíveis/remotos não entram no passivo reconhecido.","tables":[[["Processos judiciais","Valor – R$"],["Trabalhistas","800.000,00"],["Tributários","500.000,00"],["Total","1.300.000,00"]],[["Tipos","Expectativa de perda","Valor – R$"],["Trabalhistas","Possível","170.000,00"],["Trabalhistas","Provável","700.000,00"],["Tributários","Possível","150.000,00"],["Tributários","Provável","450.000,00"],["Ambientais","Remota","80.000,00"],["Ambientais","Possível","30.000,00"]]]},{"num":12,"header":"CONSULPLAN - Bach (CFC)/CFC/1º Exame de Suficiência/2022","stem":"Uma indústria comercializa o Produto A e dá garantias contratuais aos clientes no momento da venda desse seu produto. Como política de produção e comercialização já adotada há alguns anos, os clientes estarão cobertos pelo custo da reparação ou até mesmo substituição, caso surjam defeitos no produto em até doze meses a contar da data da venda (evento que cria obrigação). A indústria vem trabalhando para aprimorar todo o processo produtivo do Produto A na busca de minimizar os acionamentos dessas garantias, mas, por meio de levantamento técnico com base em experiências passadas, é provável que alguns clientes acionem as garantias. Apesar do otimismo com a qualidade do seu produto, a indústria considera R$ 80.000,00 uma estimativa confiável a ser utilizada no próximo exercício social para liquidar os custos de garantias para reparação ou substituição, caso sejam detectados defeitos em Produtos A vendidos.\n\nConsiderando-se exclusivamente as informações apresentadas e a NBC TG 25 (R2) – Provisões, Passivos Contingentes e Ativos Contingentes, a indústria deverá reconhecer o valor de R$ 80.000,00 como:","options":["Provisões para Garantias no Ativo Circulante.","Provisões para Garantias no Passivo Circulante.","Perda Estimada com Garantias no Passivo Circulante.","Passivo Contingente em conta redutora no Ativo Circulante."],"answer":"B","comment":"A venda com garantia contratual é evento passado gerador de obrigação. A saída é provável e R$ 80.000 é estimativa confiável. Reconhece despesa e provisão no passivo circulante, pois os defeitos cobertos surgem até 12 meses da venda (item 14)."},{"num":13,"header":"CONSULPLAN - Bach (CFC)/CFC/1º Exame de Suficiência/2022","stem":"Uma companhia aérea foi acionada na Justiça por um passageiro que teve sua bagagem extraviada. Os contadores da companhia aérea julgaram que a perda da causa na Justiça era provável e conseguiam estimar o valor da obrigação de modo confiável. Assinale, a seguir, o tratamento contábil da causa pela contabilidade da companhia aérea.","options":["Nada deve ser feito.","Evidenciação em nota explicativa, apenas.","Reconhecimento de passivo e de despesa, apenas.","Reconhecimento de passivo e redução de caixa, apenas."],"answer":"C","comment":"Obrigação presente por litígio, perda provável e valor confiável: débito em despesa e crédito em provisão (passivo). O caixa somente diminui quando a obrigação for efetivamente liquidada. Item 14 da NBC TG 25."},{"num":14,"header":"CONSULPLAN - Bach (CFC)/CFC/2º Exame de Suficiência/2022","stem":"Por meio de Memorando Conjunto do Departamento Jurídico e do Departamento Tributário, o Departamento de Contabilidade da Cia. Terra Prometida é comunicado de que a entidade acaba de ingressar com ação judicial contra a União, pleiteando créditos tributários cobrados a maior nos últimos cinco anos. O documento informa ainda que, em casos parecidos, não há consenso sobre o efetivo direito das empresas, sendo possível, mas improvável, o desfecho favorável da ação.\n\nDiante da situação descrita, e com base na NBC TG 25 (R2) – Provisões, Passivos Contingentes e Ativos Contingentes, o contador da Cia. Terra Prometida:","options":["Não deve proceder a qualquer registro contábil em contas patrimoniais, nem efetuar qualquer tipo de divulgação em notas explicativas.","Deve registrar em conta de Ativo Diferido o valor das diferenças apuradas pelos outros setores, atualizados monetariamente e corrigidos por juros de mora.","Deve divulgar o fato em notas explicativas sem, no entanto, proceder ao registro de qualquer direito no Balanço Patrimonial, ante a incerteza de fruição de benefícios econômicos futuros.","Deve registrar em conta de Ativo Não Circulante – Realizável a Longo Prazo – Créditos Tributários, o montante provável de realização da ação judicial, em valores nominais, divulgando o fato em notas explicativas"],"answer":"A","comment":"A empresa é autora da ação, logo a discussão envolve ativo contingente, não passivo. Ganho apenas possível, não provável: não reconhecer (item 31) e não divulgar (item 34). A alternativa A corresponde ao tratamento da banca."},{"num":15,"header":"CONSULPLAN - Bach (CFC)/CFC/2º Exame de Suficiência/2022","stem":"Em reunião com o departamento de contabilidade, o advogado de determinada empresa informa à chefia responsável, que, no último mês, a empresa foi notificada da existência de três ações judiciais, cujas características são:\n\n I. Ação de natureza trabalhista, ajuizada por ex-funcionário que alega o não recebimento de verbas. O advogado julga provável que será necessário desembolsar, até o encerramento do exercício seguinte, o valor de R$ 15.000,00, baseado em decisões recentes de casos semelhantes.\n\n II. Ação de natureza fiscal, no valor de R$ 9.000,00, ajuizada pela Prefeitura Municipal, que alega erro na base de cálculo do Imposto sobre Serviços recolhido pela empresa no último ano. O advogado afirma ser possível uma saída de recursos, mas não sabe estimar com confiança o prazo de sua ocorrência.\n\n III. Ação de natureza ambiental, movida pela autarquia de água e esgoto do município, que alega descarte irregular de lixo da empresa, e solicita indenização de R$ 14.000,00. O advogado afirma que a probabilidade de saída de recursos em decorrência deste litígio é remota, quase nula.\n\nConsiderando o exposto e com base na NBC TG 25 (R2) – Provisões, Passivos Contingentes e Ativos Contingentes, assinale a afirmativa correta.","options":["O contador deve proceder ao reconhecimento de um passivo exigível de R$ 15.000,00, além de constituir provisão no Passivo Não Circulante no valor de R$ 23.000,00.","As ações judiciais descritas nos itens I, II e III configuram-se como passivos contingentes; portanto, não é necessária qualquer provisão ou divulgação em Notas Explicativas.","O procedimento a ser adotado pelo contador, em conformidade com a Norma citada, é o reconhecimento imediato de provisão no Passivo Circulante, no valor total de R$ 38.000,00.","A ação descrita no item I requer a constituição de uma provisão, no Passivo Circulante, no valor de R$ 15.000,00, enquanto as ações descritas nos itens II e III devem ser consideradas Passivos contingentes e, por isso, não devem ser reconhecidas. Contudo, há a necessidade de divulgação, em Notas Explicativas, da ação descrita no item II."],"answer":"D","comment":"Item I: R$ 15.000, saída provável e estimável até o exercício seguinte → provisão no passivo circulante. Item II: possível → passivo contingente divulgado, ainda que o prazo seja incerto. Item III: remoto → sem provisão nem divulgação. Itens 14, 27–28 e 86."},{"num":16,"header":"CONSULPLAN - Bach (CFC)/CFC/2º Exame de Suficiência/2021","stem":"A NBC TG 25 (R1) – Provisões, Passivos Contingentes e Ativos Contingentes estabelece critérios de reconhecimento e bases de mensuração apropriados a provisões e a passivos e ativos contingentes. Diante disso, o contador de uma entidade empresária fez a contabilização da provisão para contingência de cinco processos trabalhistas, com base em seus documentos. Contudo, ele verificou que seria imprescindível consultar o departamento jurídico da entidade sobre quais as probabilidades de perda desses processos.\n\nApós a resposta do departamento jurídico, o contador comparou os seus registros com as informações dos advogados, verificando as seguintes classificações:\n\n[TABELA_1]\n\nDiante de tais informações, o contador constatou que deveria fazer a contabilização com base nas classificações do departamento jurídico, pois os advogados possuem maior conhecimento e experiência sobre o assunto. Nesse sentido, considerando apenas os dados da tabela, assinale o valor total da provisão a ser contabilizado no Balanço Patrimonial.","options":["R$ 133.000,00","R$ 155.000,00","R$ 250.000,00","R$ 288.000,00"],"answer":"B","comment":"Adotando as avaliações jurídicas: processo 1 provável R$ 80.000 e processo 2 provável R$ 75.000. Total R$ 155.000. Processo 3 remoto, processo 4 possível e processo 5 remoto não são reconhecidos. O item 14 orienta o reconhecimento.","tables":[[["Processo","Classificação do contador","Classificação do departamento jurídico","Valor (R$)"],["1","possível","provável","80.000,00"],["2","remota","provável","75.000,00"],["3","provável","remota","28.000,00"],["4","remota","possível","95.000,00"],["5","remota","remota","10.000,00"]]]},{"num":17,"header":"CONSULPLAN - Bach (CFC)/CFC/1º Exame de Suficiência/2019","stem":"A Sociedade Empresária “A” é do setor de varejo e comercializa suas centenas de produtos com uma garantia segundo a qual os clientes estarão cobertos pelo custo da reparação de qualquer defeito de fabricação que se tornar evidente dentro do primeiro ano após a compra. A experiência passada da Sociedade Empresária “A” e as expectativas futuras indicam que, para o próximo ano, dos seus produtos vendidos, 60% não apresentarão defeitos, 30% apresentarão defeitos menores e 10% apresentarão defeitos maiores.\n\nOutras informações: A Sociedade Empresária “A” irá incorrer:\n\n • Em custos de reparação de R$ 800.000,00, caso sejam detectados defeitos menores em todos os seus produtos vendidos.\n\n • Em custos de reparação de R$ 1.500.000,00, caso sejam detectados defeitos maiores em todos os produtos vendidos.\n\nConsiderando-se apenas as informações apresentadas e a NBC TG 25 (R2) – Provisões, passivos contingentes e ativos contingentes, assinale o valor esperado do custo das reparações que a Sociedade Empresária “A” reconheceria como provisão. Admita que os valores dos custos de reparação, caso sejam detectados defeitos, e as probabilidades associadas aos possíveis desfechos, foram determinados pelo julgamento da Sociedade Empresária “A”, complementado pela experiência de transações semelhantes somado aos relatórios de peritos independentes. Ainda, admita que os critérios para reconhecimento da provisão foram atendidos conforme determina a NBC TG 25 (R2).","options":["R$ 390.000,00","R$ 530.000,00","R$ 920.000,00","R$ 2.300.000,00"],"answer":"A","comment":"Valor esperado para grande população (item 39): 60% × R$ 0 + 30% × R$ 800.000 + 10% × R$ 1.500.000 = R$ 240.000 + R$ 150.000 = R$ 390.000. A provisão reflete o valor esperado, não o pior cenário."},{"num":18,"header":"CONSULPLAN - Bach (CFC)/CFC/2º Exame de Suficiência/2019","stem":"A Cia Gama foi acionada judicialmente por um antigo empregado, que reclama não ter recebido os valores devidos relativos a férias e pede R$ 20.000,00 da empresa. O advogado da Cia Gama julga que o risco de perda na Justiça é provável.\n\nAssinale o tratamento contábil nesse caso, com base na NBC TG 25 (R2) – Provisões, Passivos Contingentes e Ativos Contingentes.","options":["Reconhecimento de ativo contingente.","Reconhecimento de passivo contingente.","Reconhecimento de reserva para contingência.","Reconhecimento de provisão para contingência."],"answer":"D","comment":"Pedido de R$ 20.000 por férias não pagas, perda provável e valor informado. Pressupondo obrigação presente e estimativa confiável, reconhece provisão para litígio, não reserva de patrimônio líquido nem passivo contingente não reconhecido (item 14)."},{"num":19,"header":"FBC - Bach (CFC)/CFC/2º Exame de Suficiência/2016","stem":"O Departamento Jurídico de uma Sociedade Empresária forneceu ao Departamento de Contabilidade a relação dos processos em julgamento, conforme tabela a seguir.\n\n[TABELA_1]\n\nConsiderando-se apenas as condições estabelecidas na NBC TG 25 (R1) – PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES e os dados da tabela apresentada, a Sociedade Empresária irá reconhecer como provisão, na contabilidade:","options":["os processos relativos a Insalubridade, a Hora Extra, a Danos Materiais e a Discussão da Constitucionalidade da Cofins, que totalizam R$5.520.000,00.","os processos relativos a Insalubridade, a Hora Extra e a Discussão da constitucionalidade da Cofins, que totalizam R$4.820.000,00.","os processos relativos a Hora Extra e a Discussão da Constitucionalidade da Cofins, que totalizam R$3.320.000,00.","os processos relativos a Insalubridade e a Danos Materiais, que totalizam R$2.200.000,00."],"answer":"C","comment":"Somente causas prováveis e mensuráveis: hora extra R$ 860.000 + Cofins R$ 2.460.000 = R$ 3.320.000. Insalubridade possível divulga-se, sem provisão; danos materiais remotos não geram provisão.","tables":[[["Processos","Tipo de processo","Valor da Causa","Julgamento da Perda","Estimativa"],["1º Trabalhista","Relativo a Insalubridade","R$1.500.000,00","Possível","Confiável"],["2º Trabalhista","Relativo a hora extra","R$860.000,00","Provável","Confiável"],["3º Civil","Danos materiais","R$700.000,00","Remoto","Confiável"],["4º Tributário","Discussão da constitucionalidade da Cofins","R$2.460.000,00","Provável","Confiável"]]]},{"num":20,"header":"FBC - Bach (CFC)/CFC/2º Exame de Suficiência/2016","stem":"Uma Sociedade Empresária apresentava um saldo de R$350.000,00 em Duplicatas a Receber, em 31.12.2015, antes do encerramento do seu Balanço Patrimonial.\n\nAo proceder a mensuração do valor recuperável dessas duplicatas a receber, a empresa estimou uma perda no valor recuperável de R$10.500,00.\n\nO lançamento contábil da constituição dessa perda estimada será:","options":["Débito: Perdas Estimadas com Contas a Receber – Despesas Comerciais; Crédito: Perdas Estimadas com Créditos de Liquidação Duvidosa – Clientes; R$ 10.500,00.","Débito: Custo das Mercadorias Vendidas; Crédito: Perdas Estimadas com Créditos de Liquidação Duvidosa – Clientes; R$ 10.500,00.","Débito: Perdas Estimadas com Contas a Receber – Despesas Comerciais; Crédito: Duplicatas a Receber – Clientes; R$ 10.500,00.","Débito: Custo das Mercadorias Vendidas; Crédito: Duplicatas a Receber – Clientes; R$ 10.500,00."],"answer":"A","comment":"Esta questão é sobre perda esperada em créditos a receber, e não sobre provisão para obrigação segundo o CPC 25. O lançamento correto debita despesa com perdas estimadas em contas a receber e credita conta redutora do ativo (perdas estimadas com créditos de liquidação duvidosa), R$ 10.500. A conta Duplicatas a Receber não é baixada diretamente neste reconhecimento.","image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABR4AAAc9CAIAAACBmtyhAAAACXBIWXMAAA7EAAAOxAGVKw4bAASq6UlEQVR4nOzdedwN5f8/8INbsu87WUr2fd9CdipLFKJsUSRlKfng8chOdtpsISJEJLKVtYVk30P2kOzbbTm/1+O8v67f1cycOTNnzn3f1Ov5h4d7zpxrrtmv15mZa3x+IiIiIiIiIvLAF9cVICIiIiIiInq4MVoTERERERERecJoTUREREREROQJozURERERERGRJ4zWRERERERERJ4wWhMRERERERF5wmhNRERERERE5AmjNREREREREZEnjNZEREREREREnjBaExEREREREXnCaE1ERERERETkCaM1ERERERERkSeM1kRERERERESeMFoTERERERERecJoTUREREREROQJozURERERERGRJ4zWRERERERERJ4wWhMRERERERF5wmhNRERERERE5AmjNREREREREZEnjNZEREREREREnjBaExEREREREXnCaE1ERERERETkCaM1ERERERERkSeM1kRERERERESeMFoTERERERERecJoTUREREREROQJozURERERERGRJ4zWRERERERERJ4wWhMRERERERF5wmhNRERERERE5AmjNREREREREZEnjNZEREREREREnjBaExEREREREXnCaE1ERERERETkCaM1ERERERERkSeM1kRERERERESeMFoTERERERERecJoTUREREREROQ não satisfazem aos critérios de reconhecimento da NBC TG 25 (R1).\n\n III. Os Ativos Contingentes são reconhecidos nas demonstrações contábeis, pois tratam-se de resultados que virão a ser realizados.\n\nEstão CORRETOS os itens:","options":["I e II, apenas.","I e III, apenas.","I, II e III.","II e III, apenas."],"answer":"A","comment":"I correta: obrigação presente + saída provável + mensuração confiável. II correta: passivo contingente é obrigação possível ou obrigação presente sem os critérios de reconhecimento. III falsa: ativo contingente não é reconhecido, para evitar reconhecer receita incerta (itens 14, 27 e 31)."},{"num":22,"header":"FBC - Tec Cont (CFC)/CFC/1º Exame de Suficiência/2014","stem":"A respeito dos critérios de reconhecimento de provisões, conforme o estabelecido na NBC TG 25 – Provisões, Passivos Contingentes e Ativos Contingentes, julgue as situações hipotéticas apresentadas nos itens abaixo e, em seguida, assinale a opção CORRETA.\n\n I. Uma entidade do setor de petróleo causa contaminação e opera em um país onde não há legislação ambiental. Entretanto, a entidade possui uma política ambiental amplamente divulgada, na qual ela assume a limpeza de toda a contaminação que causa. A entidade tem um histórico de honrar essa política publicada e é possível estimar, confiavelmente, os gastos com a limpeza de toda a contaminação causada.\n\n II. Em 12 de dezembro de 2013, o conselho da entidade decidiu encerrar as atividades de uma divisão. Os gastos com o encerramento das atividades foram estimados em R$1.000.000,00, e esta estimativa é confiável. Antes do fechamento do balanço de 31 de dezembro de 2013, a decisão não havia sido comunicada a qualquer um dos afetados por ela e nenhuma outra providência havia sido tomada para implementar a decisão.\n\n III. Uma loja de varejo tem a política de reembolsar compras de clientes insatisfeitos, mesmo que não haja obrigação legal para isso. Sua política de efetuar reembolso é amplamente conhecida. Com base no histórico anterior, é possível mensurar, confiavelmente, o montante dos reembolsos a serem efetuados.\n\nDevem ser objeto de constituição de provisão as situações apresentadas nos itens:","options":["I e II, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],"answer":"B","comment":"I: política pública de reparar danos e histórico de cumprimento criam obrigação não formalizada; reconhecer se saída provável. II: decisão interna não comunicada nem implementada não cria expectativa válida nos afetados; sem provisão (itens 72–75). III: política conhecida de reembolso cria obrigação não formalizada. Portanto I e III."},{"num":23,"header":"FBC - Bach (CFC)/CFC/1º Exame de Suficiência/2014","stem":"Uma sociedade empresária usa o método estatístico de estimativa do Valor Esperado para calcular o montante da provisão para garantias, de acordo com a NBC TG 25 – Provisões, Passivos Contingentes e Ativos Contingentes. Os valores de gastos com garantia previstos e respectivas probabilidades associadas são:\n\n[TABELA_1]\n\nCom base nos dados informados, o valor da provisão para garantias a ser constituída é de:","options":["R$760.000,00.","R$960.000,00.","R$4.000.000,00.","R$4.800.000,00."],"answer":"B","comment":"Valor esperado = 60% × 0 + 38% × R$ 2.000.000 + 2% × R$ 10.000.000 = R$ 760.000 + R$ 200.000 = R$ 960.000. Método adequado a grande população de itens, item 39.","tables":[[["Probabilidades","Gastos com garantia previstos"],["60%","Zero"],["38%","R$2.000.000,00"],["2%","R$10.000.000,00"]]]},{"num":24,"header":"FBC - Bach (CFC)/CFC/1º Exame de Suficiência/2013","stem":"De acordo com a NBC TG 25 – Provisões, Passivos Contingentes e Ativos Contingentes, analise os requisitos abaixo em relação ao reconhecimento de uma provisão.\n\n I. Uma provisão deve ser reconhecida quando a entidade tem uma obrigação presente, legal ou não formalizada, como resultado de evento passado.\n\n II. Uma provisão deve ser reconhecida quando seja provável, que será necessária, uma saída de recursos que incorporam benefícios econômicos para liquidar a obrigação.\n\n III. Uma provisão deve ser reconhecida quando possa ser feita uma estimativa confiável do valor da obrigação.\n\nSão requisitos necessários para o reconhecimento de uma provisão o(s) item(ns):","options":["I e II, apenas.","II e III, apenas.","III, apenas.","I, II e III."],"answer":"D","comment":"Os três requisitos são cumulativos, conforme item 14: obrigação presente resultante de evento passado; saída de recursos provável; e estimativa confiável. A falta de qualquer requisito impede reconhecer provisão."},{"num":25,"header":"FBC - Bach (CFC)/CFC/1º Exame de Suficiência/2013","stem":"Uma sociedade empresária reconhece uma provisão para garantias concedidas aos clientes, no mesmo período em que são registradas as vendas. Apesar de não ser possível prever o valor exato a ser gasto no futuro, com cada cliente, a provisão é constituída e o valor da provisão é calculado com base nas melhores estimativas disponíveis, e em bases confiáveis.\n\nJustificam o procedimento adotado pela empresa os Princípios:","options":["da Relevância e do Registro pelo Valor Original.","da Prudência e do Custo Histórico.","da Oportunidade e da Competência.","da Continuidade e da Objetividade."],"answer":"C","comment":"Garantias relacionadas a vendas são reconhecidas no período em que ocorre o evento que gera obrigação, ainda que o desembolso venha depois. Isso expressa competência e tempestividade/oportunidade na terminologia histórica da questão. O valor é estimado com base confiável, conforme CPC 25."},{"num":26,"header":"FBC - Tec Cont (CFC)/CFC/2º Exame de Suficiência/2013","stem":"A respeito do Ativo Contingente, conforme a NBC TG 25 – Provisões, Passivos Contingentes e Ativos Contingentes, assinale a opção INCORRETA.","options":["A entidade não deve reconhecer um ativo contingente.","O ativo contingente é divulgado em notas explicativas quando for provável a entrada de benefícios econômicos.","Os ativos contingentes não são reconhecidos nas demonstrações contábeis, uma vez que pode tratar-se de resultado que nunca venha a ser realizado. Porém, quando a realização do ganho é praticamente certa, então o ativo relacionado não é um ativo contingente e o seu reconhecimento é adequado.","Os ativos contingentes surgem normalmente de evento planejado ou de outros esperados que deem origem à probabilidade de entrada de benefícios econômicos para a entidade."],"answer":"D","comment":"A alternativa incorreta é D: ativos contingentes normalmente decorrem de eventos não planejados ou não esperados que geram possibilidade de entrada de benefícios (item 32), não de eventos planejados. As alternativas A, B e C refletem os itens 31, 34 e 33."},{"num":27,"header":"FBC - Bach (CFC)/CFC/1º Exame de Suficiência/2012","stem":"De acordo com a NBC TG 25 – Provisões, Passivos Contingentes e Ativos Contingentes, quando a provisão a ser mensurada envolve uma grande população de itens, a obrigação pode ser estimada utilizando o método estatístico de estimativa denominado valor esperado.\n\nUma sociedade empresária vende bens com uma garantia segundo a qual os clientes estão cobertos pelo custo da reparação de qualquer defeito de fabricação que se tornar evidente, dentro dos primeiros seis meses, após a compra. Se forem detectados defeitos menores em todos os produtos vendidos, a entidade irá incorrer em custos de reparação de R$1.000.000,00. Se forem detectados defeitos maiores em todos os produtos vendidos, a entidade irá incorrer em custos de reparação de R$4.000.000,00. A experiência passada da entidade e as expectativas futuras indicam que, para o próximo ano, 75% dos bens vendidos não terão defeito, 20% dos bens vendidos terão defeitos menores e 5% dos bens vendidos terão defeitos maiores.\n\nO valor da provisão a ser constituída utilizando o Método Estatístico de Estimativa pelo Valor Esperado é de:","options":["R$400.000,00.","R$1.250.000,00.","R$1.600.000,00.","R$5.000.000,00."],"answer":"A","comment":"Valor esperado = 75% × R$ 0 + 20% × R$ 1.000.000 + 5% × R$ 4.000.000 = R$ 200.000 + R$ 200.000 = R$ 400.000. Item 39."},{"num":28,"header":"FBC - Bach (CFC)/CFC/2º Exame de Suficiência/2012","stem":"No encerramento do Balanço de 2011 de uma sociedade empresária, foi constatada a ausência de registro de uma despesa financeira referente ao exercício de 2010, no montante de R$30.000,00. Na mesma data, verificou-se que uma provisão para questões judiciais registrada em 2010 por R$12.000,00 deveria ser revertida, uma vez que novos fatos ocorridos em 2011 levaram a equipe jurídica a avaliar como remota a possibilidade de a empresa vir a perder a questão.\n\nO registro contábil das duas situações irá provocar um impacto no resultado de 2011 de:","options":["R$12.000,00.","R$18.000,00.","R$30.000,00.","R$42.000,00."],"answer":"A","comment":"Despesa de 2010 omitida deve ser tratada como erro de período anterior, conforme CPC 23, sem afetar o resultado de 2011 na hipótese da prova. A reversão de provisão judicial de R$ 12.000, diante de risco agora remoto, aumenta o resultado de 2011 em R$ 12.000 (item 59 do CPC 25)."},{"num":29,"header":"FBC - Tec Cont (CFC)/CFC/1º Exame de Suficiência/2011","stem":"Relacione a situação descrita na primeira coluna com o procedimento a ser adotado na segunda coluna e, em seguida, assinale a opção CORRETA.\n\nA sequência CORRETA é:\n\n(1) Há obrigação presente que, provavelmente, requer uma saída de recursos. (2) Há obrigação possível ou obrigação presente que pode requerer, mas provavelmente não irá requerer uma saída de recursos. (3) Há obrigação possível ou obrigação presente cuja probabilidade de uma saída de recursos é remota.\n\n( ) Nenhuma provisão é reconhecida, mas é exigida divulgação para o passivo contingente. ( ) Nenhuma provisão é reconhecida e nenhuma divulgação é exigida. ( ) A provisão é reconhecida e é exigida divulgação para a provisão.","options":["2, 3, 1.","1, 3, 2.","2, 1, 3.","1, 2, 3."],"answer":"A","comment":"A sequência é 2, 3, 1. Situação 2: obrigação possível, saída não provável → não reconhecer e divulgar. Situação 3: risco remoto → não reconhecer nem divulgar. Situação 1: obrigação presente, saída provável e estimativa confiável → reconhecer provisão e divulgar.","image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABR4AAAc9CAIAAACBmtyhAAAACXBIWXMAAA7EAAAOxAGVKw4bAAQPmklEQVR4nOzdefwN1f8H8KuPLUQqVHay7yFbQnYqS4QiewtJfahU8nhk34myJVlT2kTIViGykzV7fZBsKWufxP29fvf96DyO2e7MnfvZfF/PPzx8zp07y5kzZ97vOzNnAkEiIiIiIiIi8iGQ1CtARERERERElLIxtSYiIiIiIiLyhak1ERERERERkS9MrYmIiIiIiIh8YWpNRERERERE5AtTayIiIiIiIiJfmFoTERERERER+cLUmoiIiIiIiMgXptZEREREREREvjC1JiIiIiIiIvKFqTURERERERGRL0ytiYiIiIiIiHxhak1ERERERETkC1NrIiIiIiIiIl+YWhMRERERERH5wtSaiIiIiIiIyBem1kRERERERES+MLUmIiIiIiIi8oWpNREREREREZEvTK2JiIiIiIiIfGFqTUREREREROQLU2siIiIiIiIiX5haExEREREREfnC1JqIiIiIiIjIF6bWRERERERERL4wtSYiIiIiIiLyhak1ERERERERkS9MrYmIiIiIiIh8YWpNRERERERE5AtTayIiIiIiIiJfmFoTERERERER+cLUmoiIiIiIiMgXptZEREREREREvjC1JiIiIiIiIvKFqTURERERERGRL0ytiYiIiIiIiHxhak1ERERERETkC1NrIiIiIiIiIl+YWhMRERERERH5wtSaiIiIiIiIyBem1kRERERERES+MLUmIiIiIiIi8oWpNREREREREZEvTK2JiIiIiIiIfGFqTUREREREROQLU2siIiIiIiIiX5haExEREREREfnC1JqIiIiIiIjIF6bWRERERERERL4wtSYiIiIiIiLyhak1ERERERERkS9MrYmIiIiIiIh8YWpNRERERERE5AtTayIiIiIiIiJfmFoTERERERER+cLUmoiIiIiIiMgXptZEREREREREvjC1JiIiIiIiIvKFqTURERERERGRL0ytiYiIiIiIiHxhak1ERERERETkC1NrIiIiIiIiIl+YWhMRERERERH5wtSaiIiIiIiIyBem1kRERERERES+MLUmIiIiIiIi8oWpNREREREREZEvTK2JiIiIiIiIfGFqTUREREREROQLU2siIiIiIiIiX5haExEREREREfnC1JqIiIiIiIjIF6bWRERERERERL4wtSYiIiIiIiLyhak1ERERERERkS9MrYmIiIiIiIh8YWpNRERERERE5AtTayIiIiIiIiJfmFoTERERERER+cLUmoiIiIiIiMgXptZEREREREREvjC1JiIiIiIiIvKFqTURERERERGRL0ytiYiIiIiIiHxhak1ERERERETkC1NrIiIiIiIiIl+YWhMRERERERH5wtSaiIiIiIiIyBem1kRERERERES+MLUmIiIiIiIi8oWpNREREREREZEvTK2JiIiIiIiIfGFqTUREREREROQLU2siIiIiIiIiX5haExEREREREfnC1JqIiIiIiIjIF6bWRERERERERL4wtSYiIiIiIiLyhak1ERERERERkS9MrYmIiIiIiIh8YWpNRERERERE5AtTayIiIiIiIiJfmFoTERERERER+cLUmoiIiIiIiMgXptZEREREREREvjC1JiIiIiIiIvKFqTU const el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function tally(upto=Q.length){let ok=0,bad=0,blank=0,annul=0;for(let i=0;i<upto;i++){if(Q[i].answer===null){annul++;continue}if(selected[i]===null)blank++;else if(selected[i]===Q[i].answer)ok++;else bad++}return {ok,bad,blank,annul,valid:upto-annul}}
function tableHtml(t){return '<div class="tablewrap"><table><thead><tr>'+t[0].map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+t.slice(1).map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function stemHtml(q){
 let parts=q.stem.split(/(\[TABELA_\d+\])/g);
 return parts.map(part=>{let match=part.match(/^\[TABELA_(\d+)\]$/);
 if(match){let tab=(q.tables||[])[Number(match[1])-1];return tab?tableHtml(tab):'';}
 return part.split(/\n\n+/).filter(Boolean).map(p=>'<p>'+esc(p)+'</p>').join('');
 }).join('')+(q.tables&&!q.stem.includes('[TABELA_')?q.tables.map(tableHtml).join(''):'');
}

else if(s.kind==='q'){const q=Q[s.i],sel=selected[s.i],rev=revealed[s.i];t.innerHTML='<article class="sheet"><div class="tag">'+esc(q.header)+' · QUESTÃO '+q.num+'</div><div class="stem">'+esc(q.stem)+'</div>'+(q.tables||[]).map(tableHtml).join('')+(q.image?'<div class="note">📄 Figura original da prova (amplie para ler os quadros):</div><img class="sourceimg" src="'+q.image+'" alt="Enunciado e quadros originais da questão">':'')+'<div class="options">'+q.options.map((o,k)=>{const letter='ABCD'[k],cls=rev?(q.answer===letter?'correct':sel===letter?'wrong':''):(sel===letter?'selected':'');return '<button class="option '+cls+'" onclick="choose('+s.i+','+k+')"><strong>'+letter+')</strong><span>'+esc(o)+'</span></button>'}).join('')+'</div><div class="actions"><button class="btn green" onclick="reveal('+s.i+')">💡 CONFERIR GABARITO</button><button class="btn" onclick="go('+ (pos+1) +')">📖 VER COMENTÁRIO ➡</button></div>'+(rev?'<div class="feedback '+(q.answer===null?'':sel===q.answer?'good':'bad')+'">'+(q.answer===null?'⚠️ QUESTÃO ANULADA — não pontua':sel===null?'Gabarito: '+q.answer+' — escolha uma alternativa para pontuar':sel===q.answer?'🟢 ACERTOU! Alternativa '+q.answer:'🔴 ERROU! Resposta correta: '+q.answer)+'</div>':'')+'</article>'}
else if(s.kind==='comment'){const q=Q[s.i];t.innerHTML='<article class="sheet"><div class="tag">RESOLUÇÃO MINUCIOSA • QUESTÃO '+q.num+'</div><p class="answer">'+(q.answer===null?'⚠️ QUESTÃO ANULADA':'✅ GABARITO: LETRA '+q.answer)+'</p><div class="comment">'+esc(q.comment)+'</div><p class="note">Fundamentação didática: NBC TG 25 (R2) / CPC 25, com referência aos itens pertinentes. Quando necessário, outras normas são identificadas no comentário.</p><div class="actions"><button class="btn" onclick="go('+ (pos-1) +')">⬅ Rever questão</button><button class="btn green" onclick="go('+ (pos+1) +')">Continuar ➡</button></div></article>'}
else {let upto=s.kind==='final'?Q.length:s.i+1,r=tally(upto),pct=r.valid?Math.round(100*r.ok/r.valid):0;t.innerHTML='<section class="sheet score"><div style="font-size:60px">🏆📊</div><h1>'+(s.kind==='final'?'ESCORE FINAL':'ESCORE — '+upto+' QUESTÕES')+'</h1><p><strong>'+r.ok+' ACERTOS</strong> · '+r.bad+' ERROS</p><p>'+r.blank+' não respondidas · '+r.annul+' anulada(s)</p><p><strong>'+pct+'%</strong> de acertos sobre as '+r.valid+' questões válidas</p><p class="note">Todas as 30 questões são válidas neste quiz. Questões não respondidas não são contabilizadas como acertos.</p><button class="btn green" onclick="'+(s.kind==='final'?'restart()':'go('+(pos+1)+')')+'">'+(s.kind==='final'?'↻ RECOMEÇAR':'CONTINUAR ➡')+'</button></section>'}
window.scrollTo(0,0);save()}
function choose(i,k){selected[i]='ABCD'[k];render()}function reveal(i){revealed[i]=true;render()}function go(p){pos=Math.max(0,Math.min(steps.length-1,p));render()}function restart(){if(confirm('Deseja reiniciar e apagar as respostas anteriores?')){selected.fill(null);revealed.fill(false);pos=0;render()}}
el('back').onclick=()=>go(pos-1);el('next').onclick=()=>go(pos+1);el('restart').onclick=restart;render();
